# Joomla with the last released JCB, from the joomengine image.
#
# The entrypoint installs Joomla, then installs the released JCB package, then
# runs whatever JOOMLA_CLI_COMMANDS holds. That last step is the baseline
# compile: the released compiler builds the component before this working tree
# has been anywhere near the container.
#
# run.sh sets JCB_COMPILE_COMMAND and waits for the entrypoint to say it is done.
services:
  joomla:
    image: octoleo/joomengine:latest
    ports:
      - "8080:80"
    environment:
      JOOMLA_DB_HOST: mariadb:3306
      JOOMLA_DB_USER: joomengine
      JOOMLA_DB_NAME: joomengine
      JOOMLA_DB_PASSWORD: secure_password12345
      JOOMLA_CLI_COMMANDS: "${JCB_COMPILE_COMMAND}"
    depends_on:
      - mariadb

  mariadb:
    image: mariadb:latest
    environment:
      MARIADB_USER: joomengine
      MARIADB_DATABASE: joomengine
      MARIADB_PASSWORD: secure_password12345
      MARIADB_ROOT_PASSWORD: your_root_secure_password12345
