name: Compiler golden master

# Compare full output against the PR base, or the pinned release for a manual
# run. Final post-run Power identities and emitted-source discovery also gate.
#
# Compiler and extrusion changes require a complete-compilation comparison.
on:
  pull_request:
    paths:
      - 'libraries/vendor_jcb/VDM.Joomla/src/Componentbuilder/Compiler/**'
      - 'libraries/vendor_jcb/VDM.Joomla/src/Componentbuilder/Extrusion/**'
      - '.github/golden-master/**'
      - '.github/gui-tests/discovery-scale.php'
      - '.github/workflows/compiler-golden-master.yml'
  workflow_dispatch:
    inputs:
      component:
        description: GUID of the component to compile
        required: false
        default: 160d0efb-6bf0-48eb-8d46-55cf74729501
      repository:
        description: >-
          GUID of the repository to fetch that component from. Leave it empty
          for a component the site already has.
        required: false
        default: ca50a886-0fd9-4fd8-803f-ba2cd9f43f55
      target:
        description: Generated Joomla target major
        type: choice
        options: ['3', '4', '5', '6']
        default: '6'

permissions:
  contents: read

jobs:
  compare:
    name: Full compiler comparison (Joomla ${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: ${{ github.event_name == 'pull_request' && fromJSON('[3,4,5,6]') || fromJSON(format('[{0}]', inputs.target || '6')) }}

    steps:
      - name: Check out this branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Compile with both compilers
        env:
          COMPONENT: ${{ github.event_name == 'pull_request' && '3745af8f-f96b-4e17-831e-eb4062cd4389' || inputs.component }}
          REPOSITORY: ${{ github.event_name == 'pull_request' && '562624ab-48bf-4979-9a14-6b10cf3635de' || inputs.repository }}
          TARGET_JOOMLA: ${{ matrix.target }}
          BASELINE_REF: ${{ github.event.pull_request.base.sha || '' }}
          RUN_SCALE: '1'
        run: bash .github/golden-master/run.sh "${GITHUB_WORKSPACE}/.golden-master"

      - name: Report what changed
        if: always()
        run: |
          summary=.golden-master/summary.txt

          {
            echo "### Compiler golden master"
            echo
            echo "Host Joomla 6; generated target Joomla ${{ matrix.target }}."
            echo "PR runs use the public Hello World blueprint and compare the PR base with the candidate."

            if [[ -n "${{ inputs.repository }}" ]]; then
              echo "Fetched first from repository \`${{ inputs.repository }}\`."
            fi

            echo

            if [[ ! -f "$summary" ]]; then
              echo "The comparison did not get as far as producing a summary. Read the job log."
            elif [[ -s "$summary" ]]; then
              echo "The two compilers produced **different** components:"
              echo
              echo '```'
              cat "$summary"
              echo '```'
              echo
              echo "The whole diff is in the artifact, as \`full.diff\`, and is printed"
              echo "in the job log too, under *The diff between the two compiles*."
            else
              echo "The two compilers produced the **same** component, byte for byte."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: golden-master-j${{ matrix.target }}
          path: |
            .golden-master/summary.txt
            .golden-master/full.diff
            .golden-master/baseline.log
            .golden-master/candidate.log
            .golden-master/container.log
            .golden-master/baseline
            .golden-master/candidate
            .golden-master/*-powers.json
            .golden-master/*-source.txt
            .golden-master/powers.diff
            .golden-master/discovery-scale.json
            .golden-master/discovery-scale.log
            .golden-master/install-*.log
            .golden-master/fetch.log
            .golden-master/*-installed.sha256
            .golden-master/verify-*.log
          if-no-files-found: warn
          retention-days: 30
