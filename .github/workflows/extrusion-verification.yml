name: Extrusion implementation verification

on:
  push:
    branches:
      - fix/extrusion-scoped-power-identity
    paths:
      - .github/extrusion-transfer.json

permissions:
  contents: write

concurrency:
  group: extrusion-implementation-transfer
  cancel-in-progress: false

jobs:
  verify-and-commit:
    if: github.repository == 'extension-builder/joomla' && github.ref == 'refs/heads/fix/extrusion-scoped-power-identity'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the authorized implementation branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Validate and apply the exact reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          transfer=.github/extrusion-transfer.json
          base="$(jq -r .base "$transfer")"
          git merge-base --is-ancestor "$base" HEAD
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/extrusion-verification.yml|.github/extrusion-transfer.*) ;;
              *) printf 'The branch advanced outside the transfer boundary: %s\n' "$path" >&2; exit 1 ;;
            esac
          done < <(git diff --name-only "$base" HEAD)
          encoded="$RUNNER_TEMP/extrusion-approved.b64"
          : > "$encoded"
          while IFS= read -r path; do
            case "$path" in
              .github/extrusion-transfer.[0-9][0-9]) cat "$path" >> "$encoded" ;;
              *) printf 'Invalid transfer part: %s\n' "$path" >&2; exit 1 ;;
            esac
          done < <(jq -r '.parts[]' "$transfer")
          patch="$RUNNER_TEMP/extrusion-approved.patch"
          base64 --decode "$encoded" | gzip --decompress > "$patch"
          printf '%s  %s\n' "$(jq -r .sha256 "$transfer")" "$patch" | sha256sum --check
          while IFS= read -r path; do
            case "$path" in
              libraries/vendor_jcb/*|docs/architecture/extrusion.md|docs/architecture/jcb-linking-rules.md|docs/graphical-user-interface-changes/*|admin/src/Model/AjaxModel.php|admin/assets/js/extrusion.js|admin/tmpl/extrusion/default.php|.github/gui-tests/*|.github/workflows/vendor-jcb-tests.yml|.github/workflows/gui-tests.yml) ;;
              *) printf 'Patch path is outside the authorized change boundary: %s\n' "$path" >&2; exit 1 ;;
            esac
          done < <(git apply --numstat "$patch" | cut -f3)
          git apply --check --whitespace=error "$patch"
          git apply --index --whitespace=error "$patch"
          jq -r .message "$transfer" > "$RUNNER_TEMP/extrusion-commit-message"
          jq -r '.test_filter // ""' "$transfer" > "$RUNNER_TEMP/extrusion-test-filter"
          git rm -- .github/extrusion-transfer.* .github/workflows/extrusion-verification.yml
          git config user.name 'JCB Extrusion Agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --check
          git commit -F "$RUNNER_TEMP/extrusion-commit-message"
          git rev-parse HEAD

      - name: Check out pinned Joomla test runtime
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: joomla/joomla-cms
          ref: c623e73b17c749f4644cb5634f59ca683b69d17b
          path: libraries/vendor_jcb/tests/.runtime/joomla-cms
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          coverage: none
          extensions: curl, dom, fileinfo, gd, intl, ldap, mbstring, openssl, pdo_sqlite, simplexml, sodium, xml, xmlwriter, zip
          ini-values: memory_limit=1G
          tools: composer:2.10.2@sha256:5ee7125f8a30a34d246cefdc0bc85b8a783b28f2aec968994118512350d28027
        env:
          fail-fast: true

      - name: Install locked test dependencies
        run: composer --working-dir=libraries/vendor_jcb/tests install --prefer-dist --no-progress --optimize-autoloader --no-interaction

      - name: Run production-service verification
        shell: bash
        env:
          MIBS: ''
        run: |
          set -euo pipefail
          cd libraries/vendor_jcb/tests
          filter="$(cat "$RUNNER_TEMP/extrusion-test-filter")"
          args=(--configuration phpunit.xml.dist --exclude-group known-defect --no-coverage)
          if [[ -n "$filter" ]]; then args+=(--filter "$filter"); fi
          php vendor/bin/phpunit "${args[@]}"
          php bin/check-php-style.php --base=HEAD^
          php bin/check-test-ownership.php --base=HEAD^
          php bin/check-moved-conditions.php --base=HEAD^
          php bin/check-container-keys.php

      - name: Push the verified implementation commit without force
        run: git push origin HEAD:refs/heads/fix/extrusion-scoped-power-identity
