name: Extrusion verification workspace

on:
  push:
    branches:
      - fix/extrusion-scoped-power-identity
    paths:
      - .github/workflows/extrusion-verification.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out pinned Joomla test runtime
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: joomla/joomla-cms
          ref: c623e73b17c749f4644cb5634f59ca683b69d17b # 6.1.2
          path: libraries/vendor_jcb/tests/.runtime/joomla-cms
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          coverage: none
          extensions: curl, dom, fileinfo, gd, intl, ldap, mbstring, openssl, pdo_sqlite, simplexml, sodium, xml, xmlwriter, zip
          ini-values: memory_limit=1G
          tools: composer:2.10.2@sha256:5ee7125f8a30a34d246cefdc0bc85b8a783b28f2aec968994118512350d28027
        env:
          fail-fast: true

      - name: Install locked test dependencies
        run: composer --working-dir=libraries/vendor_jcb/tests install --prefer-dist --no-progress --optimize-autoloader --no-interaction

      - name: Run baseline unit suite
        run: |
          set -o pipefail
          composer --working-dir=libraries/vendor_jcb/tests test 2>&1 | tee "$RUNNER_TEMP/extrusion-baseline.log"

      - name: Capture PHP and its non-system runtime dependencies
        run: |
          runtime="$RUNNER_TEMP/extrusion-php"
          mkdir -p "$runtime/extensions" "$runtime/lib" "$runtime/conf.d"
          cp -L "$(command -v php)" "$runtime/php"
          cp -L "$(php -r 'echo php_ini_loaded_file();')" "$runtime/php.ini"
          php -r 'foreach (explode(",", php_ini_scanned_files()) as $file) { echo trim($file), PHP_EOL; }' |
            while IFS= read -r file; do
              if [[ -n "$file" ]]; then
                cp -L "$file" "$runtime/conf.d/$(basename "$file")"
              fi
            done
          extensions="$(php -r 'echo ini_get("extension_dir");')"
          cp -L "$extensions/"*.so "$runtime/extensions/"
          ldd "$runtime/php" "$runtime/extensions/"*.so |
            awk '/=> \// {print $3}' | sort -u |
            while IFS= read -r library; do
              case "$(basename "$library")" in
                libc.so.*|libm.so.*|libpthread.so.*|libdl.so.*|librt.so.*|libresolv.so.*|ld-linux*) continue ;;
              esac
              cp -L "$library" "$runtime/lib/$(basename "$library")"
            done
          printf '%s\n' '#!/usr/bin/env bash' 'set -euo pipefail' \
            'root="$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)"' \
            'export LD_LIBRARY_PATH="$root/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"' \
            'export PHP_INI_SCAN_DIR="$root/conf.d"' \
            'exec "$root/php" -c "$root/php.ini" -d "extension_dir=$root/extensions" "$@"' \
            > "$runtime/run-php"
          chmod +x "$runtime/run-php"
          tar -czf "$RUNNER_TEMP/extrusion-php.tar.gz" -C "$RUNNER_TEMP" extrusion-php

      - name: Upload isolated PHP runtime
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: extrusion-php-runtime
          path: |
            ${{ runner.temp }}/extrusion-php.tar.gz
            ${{ runner.temp }}/extrusion-baseline.log
          if-no-files-found: error
          retention-days: 3
