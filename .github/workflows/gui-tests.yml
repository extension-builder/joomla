name: GUI tests

# Playwright against a real Joomla administrator: the joomengine container
# installs the released JCB, this working tree is installed over it — the same
# flow as the golden master — and the suite in libraries/vendor_jcb/tests/gui
# drives the interface through the browser, AJAX and all.
#
# It runs on pull requests that touch the interface or the suite itself, and
# on demand. Every run leaves a report artifact; a failing run also leaves the
# traces, screenshots and videos of what went wrong.
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - 'admin/**'
      - 'media/**'
      - 'componentbuilder.xml'
      # the engine drives what the browser journeys see -- the live import
      # writes what these classes resolve, so an engine change without a GUI
      # run is a regression the suite exists to catch
      - 'libraries/vendor_jcb/VDM.Joomla/**'
      - 'libraries/vendor_jcb/tests/gui/**'
      - '.github/gui-tests/**'
      - '.github/workflows/gui-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gui-tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gui-tests:
    name: Playwright against joomengine
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out this branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Cache npm downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('libraries/vendor_jcb/tests/gui/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Cache Playwright browsers
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('libraries/vendor_jcb/tests/gui/package-lock.json') }}

      - name: Run the GUI suite
        env:
          PLAYWRIGHT_INSTALL_ARGS: --with-deps chromium
        run: bash .github/gui-tests/run.sh "${GITHUB_WORKSPACE}/.gui-tests"

      - name: Report what the suite saw
        if: always()
        run: bash .github/gui-tests/report.sh "${GITHUB_WORKSPACE}/.gui-tests/results.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gui-tests
          path: |
            .gui-tests/results.json
            .gui-tests/playwright-report
            .gui-tests/test-results
            .gui-tests/container.log
            .gui-tests/install.log
          if-no-files-found: warn
          retention-days: 30
