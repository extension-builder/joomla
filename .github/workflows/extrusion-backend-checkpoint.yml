name: Extrusion backend checkpoint

on:
  push:
    branches: [fix/extrusion-scoped-power-identity]
    paths: [.github/workflows/extrusion-backend-checkpoint.yml]

permissions:
  contents: write
  actions: write

concurrency:
  group: extrusion-backend-checkpoint
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'extension-builder/joomla' && github.ref == 'refs/heads/fix/extrusion-scoped-power-identity'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the authorized implementation branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Apply the exact locally verified source tree
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 0bdfefa9353fc9287c9364fd11a45fd812865435
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/extrusion-backend-checkpoint.yml
          compressed="$RUNNER_TEMP/extrusion-backend.patch.xz"
          patch="$RUNNER_TEMP/extrusion-backend.patch"
          : > "$compressed"
          for blob in a51dbe5f617e57694228f66fa2713d5b2c602f69 db1257afe841a3b3f90a6fe99c752214c0444ba5 a3f3b96eb652c5df681bf63a4696fad29f94b0f0 e27f2998ad23bf21c753ee860bc4245bd8cfb0f6; do
            gh api "repos/extension-builder/joomla/git/blobs/$blob" --jq .content | base64 --decode >> "$compressed"
          done
          xz --decompress --stdout "$compressed" > "$patch"
          printf '25a09c4b24b059a61ccc97b3aa327d699fc6c4b286d0e06f35068852afb7e3ce  %s\n' "$patch" | sha256sum --check
          while IFS= read -r path; do
            case "$path" in libraries/vendor_jcb/*) ;; *) echo "Unexpected patch path: $path" >&2; exit 1;; esac
          done < <(git apply --numstat "$patch" | cut -f3)
          git apply --check --whitespace=error "$patch"
          git apply --index --whitespace=error "$patch"
          git rm -- .github/workflows/extrusion-backend-checkpoint.yml
          test "$(git write-tree)" = fa21bb40c0c6e3c1c25e15154d19bacaf233db6e
          git diff --cached --check
          git config user.name 'JCB Extrusion Agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(extrusion): resolve scoped Power identities and preflight effective writes' -m 'Use actual component references, evidence-based namespace roles, stable source keys, complete dependency mappings, and a shared effective write plan. Validate source and database snapshots before transactional Data writes; preserve skipped references and curated fields. Include production-service fixtures and migrate superseded word-based and first-wins expectations. This commit contains ordinary source and tests; the temporary publishing workflow removes itself.'

      - name: Check out pinned Joomla test runtime
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: joomla/joomla-cms
          ref: c623e73b17c749f4644cb5634f59ca683b69d17b
          path: libraries/vendor_jcb/tests/.runtime/joomla-cms
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          coverage: none
          extensions: curl, dom, fileinfo, gd, intl, ldap, mbstring, openssl, pdo_sqlite, simplexml, sodium, xml, xmlwriter, zip
          ini-values: memory_limit=1G
          tools: composer:2.10.2@sha256:5ee7125f8a30a34d246cefdc0bc85b8a783b28f2aec968994118512350d28027
        env:
          fail-fast: true

      - name: Install locked test dependencies
        run: composer --working-dir=libraries/vendor_jcb/tests install --prefer-dist --no-progress --optimize-autoloader --no-interaction

      - name: Verify all backend tests and repository gates
        shell: bash
        env:
          MIBS: ''
        run: |
          set -euo pipefail
          git diff --check 5ee658dd07eb749dca43ed4722f6cca7eb8208cf...HEAD
          cd libraries/vendor_jcb/tests
          php bin/check-php-style.php --base=5ee658dd07eb749dca43ed4722f6cca7eb8208cf
          php bin/check-test-ownership.php --base=5ee658dd07eb749dca43ed4722f6cca7eb8208cf
          php bin/check-moved-conditions.php --base=5ee658dd07eb749dca43ed4722f6cca7eb8208cf
          php bin/check-container-keys.php
          composer test

      - name: Push the verified source commit without force
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code
          git push origin HEAD:refs/heads/fix/extrusion-scoped-power-identity
          printf 'Published source commit: %s\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Run the standard PHP verification matrix on the published branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/extension-builder/joomla/actions/workflows/vendor-jcb-tests.yml/dispatches -f ref=fix/extrusion-scoped-power-identity
