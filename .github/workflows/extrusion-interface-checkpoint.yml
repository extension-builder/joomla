name: Extrusion interface checkpoint

on:
  push:
    branches: [fix/extrusion-scoped-power-identity]
    paths: [.github/workflows/extrusion-interface-checkpoint.yml]

permissions:
  contents: write
  actions: write

jobs:
  publish:
    if: github.repository == 'extension-builder/joomla' && github.ref == 'refs/heads/fix/extrusion-scoped-power-identity'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Publish exact locally verified source and tests
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 2c8983f00e63d1809c966000620194227ba29a5b
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/extrusion-interface-checkpoint.yml
          compressed="$RUNNER_TEMP/interface.patch.xz"
          patch="$RUNNER_TEMP/interface.patch"
          : > "$compressed"
          for blob in c3dd302f3d5adaceddfbe420ef93fa6f6019172b 5eda73a55bb0d050001905be53919208f6315cde; do
            gh api "repos/extension-builder/joomla/git/blobs/$blob" --jq .content | base64 --decode >> "$compressed"
          done
          xz --decompress --stdout "$compressed" > "$patch"
          printf 'b8e13fa9f59abe905d1b1eaa014b0be8a5f0ec015c93ecffc7207b14189024f9  %s\n' "$patch" | sha256sum --check
          while IFS= read -r path; do
            case "$path" in
              libraries/vendor_jcb/*|.github/gui-tests/*|.github/workflows/gui-tests.yml|docs/graphical-user-interface-changes/*|admin/src/Model/AjaxModel.php|admin/assets/js/extrusion.js|admin/tmpl/extrusion/default.php) ;;
              *) echo "Unexpected patch path: $path" >&2; exit 1;;
            esac
          done < <(git apply --numstat "$patch" | cut -f3)
          git apply --check --whitespace=error "$patch"
          git apply --index --whitespace=error "$patch"
          git rm -- .github/workflows/extrusion-interface-checkpoint.yml
          test "$(git write-tree)" = 40c579d240e044ca97ea83e7ce691184f248439d
          git diff --cached --check
          php -l admin/src/Model/AjaxModel.php
          php -l admin/tmpl/extrusion/default.php
          php -l .github/gui-tests/extrusion-fixtures.php
          node --check admin/assets/js/extrusion.js
          node --check libraries/vendor_jcb/tests/gui/specs/extrusion.spec.js
          bash -n .github/gui-tests/run.sh
          git config user.name 'JCB Extrusion Agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(extrusion): connect reviewed Power plans to the pairing interface' -m 'Use stable source rows, actual target metadata, complete context refresh and reviewed-plan scope acknowledgement. Coordinate component/Power execution once. Add browser journeys and disposable Data/compiler integration fixtures, protected-path change record, and the missing baseline helper documentation required by the full style gate. Local PHP: 4205 tests, 44361 assertions; all repository gates passed.'
          git push origin HEAD:refs/heads/fix/extrusion-scoped-power-identity
          echo "Published $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          for workflow in vendor-jcb-tests.yml gui-tests.yml; do
            gh api --method POST "repos/extension-builder/joomla/actions/workflows/$workflow/dispatches" -f ref=fix/extrusion-scoped-power-identity
          done
