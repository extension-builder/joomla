name: Extrusion review source

on:
  push:
    branches: [fix/extrusion-scoped-power-identity]
    paths: [.github/workflows/extrusion-review-checkpoint.yml]

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Export tracked source without credentials or workspace state
        run: |
          set -euo pipefail
          git archive --format=tar HEAD | gzip > "$RUNNER_TEMP/extrusion-review-source.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/extrusion-review-revision.txt"
          sha256sum "$RUNNER_TEMP/extrusion-review-source.tar.gz"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: extrusion-review-source
          path: |
            ${{ runner.temp }}/extrusion-review-source.tar.gz
            ${{ runner.temp }}/extrusion-review-revision.txt
          retention-days: 1
